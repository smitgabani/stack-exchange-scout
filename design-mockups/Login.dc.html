<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --ink:#181d26;--primary:#181d26;--primary-active:#0d1218;--body:#333840;--muted:#41454d;
      --hairline:#dddddd;--border-strong:#9297a0;--canvas:#ffffff;--surface-soft:#f8fafc;
      --cream:#f5e9d4;--coral:#aa2d00;--on-primary:#ffffff;--link:#1b61c9;--link-active:#1a3866;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Archivo',-apple-system,'Helvetica Neue',Arial,sans-serif;color:var(--ink);}
    a{color:var(--link);}
    a:hover{color:var(--link-active);}
    .bg{
      position:relative;min-height:900px;width:100%;overflow:hidden;
      background:radial-gradient(circle at 50% -8%, #fbf4e6 0%, var(--cream) 38%, #ffffff 78%);
      display:flex;flex-direction:column;
    }
    .ring{position:absolute;top:50%;left:50%;border-radius:9999px;border:1px solid rgba(24,29,38,0.08);transform:translate(-50%,-50%);pointer-events:none;}
    .ring-1{width:1040px;height:1040px;}
    .ring-2{width:760px;height:760px;}
    .topbar{position:relative;z-index:1;padding:32px 40px;display:flex;align-items:center;gap:10px;}
    .wordmark-badge{width:32px;height:32px;border-radius:9px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .wordmark-text{font-size:16px;font-weight:500;}
    .center{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;padding:24px 24px 80px 24px;}
    .card{
      width:100%;max-width:420px;background:#ffffff;border-radius:24px;padding:48px 40px 40px 40px;
      display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
      box-shadow:0 40px 80px -32px rgba(24,29,38,0.22), 0 2px 6px rgba(24,29,38,0.05);
    }
    .icon-badge{width:56px;height:56px;border-radius:16px;background:var(--surface-soft);border:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
    .title{font-size:24px;font-weight:500;line-height:1.35;}
    .subtitle{font-size:14px;color:var(--muted);line-height:1.4;max-width:300px;margin-top:6px;margin-bottom:28px;}
    .field-wrap{width:100%;position:relative;margin-bottom:8px;}
    .field-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);display:flex;color:var(--muted);}
    .toggle-icon{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;width:40px;height:40px;color:var(--muted);cursor:pointer;background:none;border:none;}
    input{
      width:100%;font-family:inherit;font-size:15px;padding:16px 48px;border-radius:9999px;
      border:1px solid var(--hairline);background:var(--surface-soft);color:var(--ink);
    }
    input::placeholder{color:var(--muted);}
    input:focus{outline:2px solid var(--ink);outline-offset:2px;}
    .error{width:100%;text-align:left;font-size:13.12px;font-weight:600;letter-spacing:0.16px;color:var(--ink);margin:-2px 0 4px 8px;}
    .btn-primary{
      width:100%;background:var(--primary);color:var(--on-primary);font-size:16px;font-weight:500;
      border:none;border-radius:9999px;padding:16px 24px;cursor:pointer;margin-top:16px;
    }
    .btn-primary:active{background:var(--primary-active);}
    .footnote{font-size:13.12px;color:var(--muted);line-height:1.4;margin-top:24px;max-width:300px;}
  </style>
</helmet>
<div class="bg">
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>

  <div class="topbar">
    <div class="wordmark-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12L10 17L19 7" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="wordmark-text">Challenge Scout</div>
  </div>

  <div class="center">
    <div class="card">
      <div class="icon-badge">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M9 4H5C4.44772 4 4 4.44772 4 5V19C4 19.5523 4.44772 20 5 20H9" stroke="#181d26" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 16L20 12L15 8" stroke="#181d26" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 12H9" stroke="#181d26" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="title">Enter the access password</div>
      <div class="subtitle">This is a personal tool. One shared password keeps it away from anyone who just finds the URL.</div>

      <div class="field-wrap">
        <div class="field-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <input type="{{fieldType}}" placeholder="Password" value="{{password}}" onInput="{{onInput}}" />
        <button class="toggle-icon" onClick="{{onToggleVisibility}}">
          <sc-if value="{{showPassword}}" hint-placeholder-val="{{false}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M2 12S5.5 5 12 5s10 7 10 7-3.5 7-10 7S2 12 2 12z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>
          </sc-if>
          <sc-if value="{{hidePassword}}" hint-placeholder-val="{{true}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 3L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M10.6 5.1A10.7 10.7 0 0112 5c6.5 0 10 7 10 7a15 15 0 01-3.2 4M6.7 6.7C4 8.3 2 12 2 12s3.5 7 10 7a9.7 9.7 0 004.1-.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9.9 9.9a3 3 0 004.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </sc-if>
        </button>
      </div>

      <sc-if value="{{showError}}" hint-placeholder-val="{{false}}">
        <div class="error">That password isn't right — try again.</div>
      </sc-if>

      <button class="btn-primary" onClick="{{onSubmit}}">{{buttonLabel}}</button>
      <div class="footnote">No accounts here — just this one password for the one person using this app.</div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { password: "", showError: false, checking: false, showPassword: false };
  }
  renderVals() {
    return {
      password: this.state.password,
      fieldType: this.state.showPassword ? "text" : "password",
      showPassword: this.state.showPassword,
      hidePassword: !this.state.showPassword,
      onToggleVisibility: () => this.setState({ showPassword: !this.state.showPassword }),
      onInput: (e) => this.setState({ password: e.target.value, showError: false }),
      showError: this.state.showError,
      buttonLabel: this.state.checking ? "Checking…" : "Unlock",
      onSubmit: () => {
        if (this.state.checking) return;
        this.setState({ checking: true });
        setTimeout(() => {
          const ok = this.state.password.length > 0;
          this.setState({ checking: false, showError: !ok });
        }, 400);
      },
    };
  }
}
</script>
</body>
</html>

# fly.toml app configuration file generated for backend-soft-headland-5023 on 2026-09-15T19:14:53-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-soft-headland-5023'
primary_region = 'sjc'

[build]

[deploy]
  release_command = 'alembic upgrade head'

[http_service]
  internal_port = 8000
  force_https = true
  # Kept warm rather than scaled to zero. Two reasons, both load-bearing:
  # background jobs run in this process and are lost if it stops mid-run, and
  # the connection pool depends on the event loop surviving between requests.
  # Costs a few dollars a month; buys ~290ms off every request and no cold starts.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

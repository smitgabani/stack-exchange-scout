name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.12.13
      - run: uv sync --frozen
      - run: uv run ruff check .

  # Catches the class of bug where runtime code imports a dev-only dependency:
  # the Docker image builds with --no-dev, so such an import passes CI and then
  # crashes the deployed app on startup (which is exactly how httpx got us).
  production-imports:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/placeholder
      APP_ACCESS_PASSWORD: test-password
      APP_SECRET_KEY: test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.12.13
      - run: uv sync --frozen --no-dev
      - run: uv run python -c "import app.main"

  test:
    runs-on: ubuntu-latest
    services:
      # M2's profile/credentials tests do real DB round-trips — a fresh,
      # disposable Postgres per CI run, never the real Supabase dev project.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test
      # conftest.py deliberately ignores DATABASE_URL (locally it points at
      # production) and connects to TEST_DATABASE_URL instead. Without this
      # it fell back to a passwordless localhost URL and every test failed to
      # connect as the runner user.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test
      APP_ACCESS_PASSWORD: test-password
      APP_SECRET_KEY: test-secret-key
      YUTORI_WEBHOOK_SECRET: test-webhook-secret
      PUBLIC_BASE_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.12.13
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run pytest
